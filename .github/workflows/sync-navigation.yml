name: Sync Notion lesson navigation
on:
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * *' # 08:20 Asia/Seoul
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Update Notion navigation
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python sync_navigation.py
