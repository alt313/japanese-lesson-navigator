<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>일본어 수업 이동</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;font-family:system-ui,-apple-system,sans-serif;color:#242424;background:#fff}.panel{border:1px solid #dedede;border-radius:14px;padding:14px}.title{font-weight:650;margin-bottom:16px}.nav{display:flex;justify-content:space-between;border-top:1px solid #eee;border-bottom:1px solid #eee;padding:17px 0;gap:8px}.nav a{color:#666;font-size:13px;text-decoration:none}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;font-size:13px}.controls{display:flex;gap:8px}select{border:1px solid #ddd;border-radius:24px;padding:8px 12px;background:white;color:#222}button{background:#111;color:white;border:0;border-radius:24px;padding:8px 17px;cursor:pointer}@media(max-width:420px){.bottom{align-items:stretch;flex-direction:column}.controls{justify-content:flex-end}}</style></head><body><div class="panel"><div class="title">📖 다른 일차로 이동</div><div class="nav"><a id="prev"></a><a id="next"></a></div><div class="bottom"><span>원하는 일차로 이동</span><div class="controls"><select id="day" aria-label="이동할 일차"></select><button id="go">이동 →</button></div></div></div><script>const ids=['81f9849ec2307c222af5','81998e35c35a623e2c69','810d8cfcf269b7d8275f','8179837ad8db779ace4c','8124a08ef9644882bff4','81469afde254c10af21c','8103baaffd18900bceb0','81768cd4f4c8d45c9d89','8114bf97d4faf3ecbb3c','8110b57ef3993ad76a05','817d976bf7967c1091cb','81a39c3afcb792fb91e9','81efb0f6c7f1520a2edb','816394a9dd6a40ada117'];const url=i=>'https://www.notion.so/41c88625f86b'+ids[i];const params=new URLSearchParams(location.search);const current=Math.max(1,Math.min(ids.length,Number(params.get('day'))||3));const sel=document.querySelector('#day');ids.forEach((_,i)=>sel.add(new Option((i+1)+'일차',String(i+1))));sel.value=String(current);const prev=document.querySelector('#prev'),next=document.querySelector('#next');if(current>1){prev.textContent='← 이전 일차 · '+(current-1)+'일차';prev.href=url(current-2)}else prev.textContent='첫 수업';if(current<ids.length){next.textContent='다음 일차 · '+(current+1)+'일차 →';next.href=url(current)}else next.textContent='마지막 수업';document.querySelector('#go').onclick=()=>window.open(url(Number(sel.value)-1),'_blank','noopener');</script></body></html>
